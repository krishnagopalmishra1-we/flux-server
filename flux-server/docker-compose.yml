# Clean image-generation only compose file.
# Runs FLUX.1-dev using FP8 on single or multiple GPUs.

services:
  flux-server:
    build: .
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      # Model cache locations
      - /mnt/hf-cache-disk:/mnt/hf-cache
      - model_cache_ssd:/app/model_cache
      - outputs:/mnt/outputs
      # LoRA adapters
      - ./loras:/app/loras
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - MODEL_ID=black-forest-labs/FLUX.1-dev
      - FLUX_QUANTIZE=fp8
    env_file:
      - .env
    shm_size: '16g'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  outputs:
  model_cache_ssd:
