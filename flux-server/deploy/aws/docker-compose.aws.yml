# AWS deployment — g5.2xlarge (1 × A10G 24 GB).
# Default model: flux-1-dev with FP8 quantization (~18 GB VRAM, fits on 24 GB A10G).
# Image generation only.
# bootstrap.sh copies this to flux-server/docker-compose.yml on the EC2 instance.

services:
  flux-server:
    build: .
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      # EBS gp3 data disk (500 MB/s) — all model families live here
      - /mnt/model-disk/hf-cache:/mnt/hf-cache
      - /mnt/model-disk/model-cache-ssd:/app/model_cache
      - /mnt/model-disk/outputs:/mnt/outputs
      # LoRA adapters — bind-mount so uploads survive container rebuilds
      - ./loras:/app/loras
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # ── Model selection ───────────────────────────────────────────────────────
      # flux-1-dev with FP8 (torchao): ~18 GB VRAM, 1.8× faster than NF4.
      # TEXT encoders (T5-XXL) stay in INT8 to keep total footprint <20 GB.
      - MODEL_ID=black-forest-labs/FLUX.1-dev
      - FLUX_QUANTIZE=fp8
    env_file:
      - .env
    shm_size: '16g'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
