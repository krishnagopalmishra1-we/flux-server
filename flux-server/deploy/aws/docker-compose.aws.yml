# AWS deployment compose file.
# bootstrap.sh copies this to flux-server/docker-compose.yml on the EC2 instance.
# All models live on the persistent EBS data disk mounted at /mnt/model-disk.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /mnt/model-disk/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  flux-server:
    build: .
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      # EBS gp3 data disk (500 MB/s) — all model families live here
      - /mnt/model-disk/hf-cache:/mnt/hf-cache
      - /mnt/model-disk/model-cache-ssd:/app/model_cache
      - /mnt/model-disk/outputs:/mnt/outputs
      # LoRA adapters — bind-mount so uploads survive container rebuilds
      - ./loras:/app/loras
      - ./video_loras:/app/video_loras
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Single-GPU deployment for g5.2xlarge (1 × A10G)
      - VIDEO_PARALLEL_BACKEND=auto
      - GPUS_PER_JOB=1
      - JOB_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    shm_size: '16g'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
