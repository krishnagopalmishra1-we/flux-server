# Vultr 8-worker reverse proxy with sticky sessions.
# ip_hash routes all requests from the same client IP to the same gunicorn worker,
# so job_id lookups always land on the worker that created the job.
#
# Placed at /etc/nginx/conf.d/default.conf inside the nginx container.

upstream gunicorn {
    ip_hash;
    server flux-server:8080;
}

server {
    listen 80;

    # LoRA uploads can be up to MAX_LORA_UPLOAD_MB=1536 MB
    client_max_body_size 2g;

    # WAN 14B generation takes up to 30 min — give it plenty of headroom
    proxy_read_timeout    3600s;
    proxy_connect_timeout   60s;
    proxy_send_timeout    3600s;

    location / {
        proxy_pass         http://gunicorn;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Disable buffering — required for SSE (job progress streaming).
        # nginx would otherwise hold the entire response before forwarding.
        proxy_buffering    off;
        proxy_cache        off;

        # HTTP/1.1 + empty Connection header keeps SSE connections alive
        proxy_http_version 1.1;
        proxy_set_header   Connection        '';
    }
}
