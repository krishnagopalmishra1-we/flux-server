# Vultr Cloud GPU deployment compose file.
# bootstrap.sh copies this to flux-server/docker-compose.yml on the instance.
# All models live on the attached block storage volume at /mnt/model-disk.
#
# vbm-112c-2048gb-8-a100-gpu: 8× A100 SXM 80GB — all 8 GPUs exposed to the container.
# gunicorn post_fork hook assigns each worker its own GPU via CUDA_VISIBLE_DEVICES.
# Do NOT set CUDA_VISIBLE_DEVICES here — workers manage it themselves.
#
# nginx sits in front (port 8080) with ip_hash sticky sessions so that job_id
# polling always lands on the same gunicorn worker that created the job.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # Path is relative to $FLUX_DIR (where docker compose runs after bootstrap copies this file).
      - ./deploy/vultr/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      flux-server:
        condition: service_healthy
    restart: unless-stopped

  flux-server:
    build: .
    user: "0:0"
    # Port NOT exposed to host — all traffic enters via nginx above.
    # gunicorn still binds 0.0.0.0:8080 inside the container; nginx reaches it
    # via the Docker internal network at flux-server:8080.
    volumes:
      # Block storage (NVMe-backed on Vultr) — all model families live here
      - /mnt/model-disk/hf-cache:/mnt/hf-cache
      - /mnt/model-disk/outputs:/mnt/outputs
      # LoRA adapters — bind-mount so uploads survive container rebuilds
      - /mnt/model-disk/loras:/app/loras
      - /mnt/model-disk/video_loras:/app/video_loras
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # CUDA_VISIBLE_DEVICES intentionally omitted — gunicorn post_fork assigns per-worker GPU.
      # Override NUM_WORKERS to limit concurrency (default: auto-detected GPU count).
      # Override GPU_COUNT if nvidia-smi is unavailable at startup.
    env_file:
      - .env
    shm_size: '16g'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
